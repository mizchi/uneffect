name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  QUINT_EVALUATOR_VERSION: v0.6.0
  QUINT_EVALUATOR_SHA256: 61755a09d5052d93a4e75e840059edfd0d3674aeda164b9d2464be3d6e21b1c2
  JUST_VERSION: 1.58.0
  JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 10.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.92.0", components: rustfmt }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - &install-just
        name: Install checksum-pinned just binary
        run: |
          archive="$RUNNER_TEMP/just.tar.gz"
          bin_dir="$RUNNER_TEMP/just-bin"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$archive" "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  $archive" | sha256sum --check
          install -d "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" just
          echo "$bin_dir" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: just ci-fast
      - run: just build
      - run: just package-check

  z3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 10.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - *install-just
      - run: pnpm install --frozen-lockfile
      - run: just formal-z3

  quint-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 10.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - *install-just
      - run: pnpm install --frozen-lockfile
      - &install-quint-evaluator
        name: Install pinned Quint evaluator without GitHub API discovery
        run: |
          archive="$RUNNER_TEMP/quint-evaluator.tar.gz"
          destination="$HOME/.quint/rust-evaluator-$QUINT_EVALUATOR_VERSION"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$archive" "https://github.com/informalsystems/quint/releases/download/evaluator%2F$QUINT_EVALUATOR_VERSION/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz"
          echo "$QUINT_EVALUATOR_SHA256  $archive" | sha256sum --check
          install -d "$destination"
          tar -xzf "$archive" -C "$destination"
      - name: Warm Quint evaluator cache without worker races
        run: pnpm exec quint run specs/invalidate.qnt --invariant=cacheIsSound --max-steps=2 --max-samples=1 --verbosity=1
      - run: just formal-quint

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 10.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21" }
      - *install-just
      - run: pnpm install --frozen-lockfile
      - *install-quint-evaluator
      - name: Warm Quint evaluator cache without worker races
        run: pnpm exec quint run specs/invalidate.qnt --invariant=cacheIsSound --max-steps=2 --max-samples=1 --verbosity=1
      - run: just formal-integration

  exhaustive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 10.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21" }
      - *install-just
      - run: pnpm install --frozen-lockfile
      - run: just formal-exhaustive
