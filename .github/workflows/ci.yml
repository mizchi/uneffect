name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true
  QUINT_EVALUATOR_VERSION: v0.6.0
  QUINT_EVALUATOR_SHA256: 61755a09d5052d93a4e75e840059edfd0d3674aeda164b9d2464be3d6e21b1c2

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.92.0", components: rustfmt }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - run: pnpm install --frozen-lockfile
      - &install-quint-evaluator
        name: Install pinned Quint evaluator without GitHub API discovery
        run: |
          archive="$RUNNER_TEMP/quint-evaluator.tar.gz"
          destination="$HOME/.quint/rust-evaluator-$QUINT_EVALUATOR_VERSION"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/informalsystems/quint/releases/download/evaluator%2F$QUINT_EVALUATOR_VERSION/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz"
          echo "$QUINT_EVALUATOR_SHA256  $archive" | sha256sum --check
          install -d "$destination"
          tar -xzf "$archive" -C "$destination"
      - name: Install Z3 CLI
        run: sudo apt-get update && sudo apt-get install --yes z3
      - name: Warm Quint evaluator cache without worker races
        run: pnpm exec quint run specs/invalidate.qnt --invariant=cacheIsSound --max-steps=2 --max-samples=1 --verbosity=1
      - run: just check
      - run: just build
      - run: just package-check

  z3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - run: pnpm install --frozen-lockfile
      - *install-quint-evaluator
      - name: Install Z3 CLI
        run: sudo apt-get update && sudo apt-get install --yes z3
      - run: just formal-z3

  quint-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - run: pnpm install --frozen-lockfile
      - *install-quint-evaluator
      - name: Warm Quint evaluator cache without worker races
        run: pnpm exec quint run specs/invalidate.qnt --invariant=cacheIsSound --max-steps=2 --max-samples=1 --verbosity=1
      - run: just formal-quint

  exhaustive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21" }
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - run: pnpm install --frozen-lockfile
      - run: just formal-exhaustive
